{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "spring-api.serviceAccountName" . }}
  labels:
    {{- include "spring-api.labels" . | nindent 4 }}
{{- end }}
---
{{- if .Values.awsSecretsAccess.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.awsSecretsAccess.serviceAccountName }}
  labels:
    {{- include "spring-api.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.awsSecretsAccess.roleArn | quote }}
{{- end }}
